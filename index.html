<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibe Coder — Portfolio Terminal</title>
    <style>
        :root {
            --accent: #bd93f9;
            --accent-glow: rgba(189, 147, 249, 0.35);
            --bg: #282a36;
            --fg: #f8f8f2;
            --fg-dim: #a0a0b0;
            --user: #50fa7b;
            --at: #888899;
            --dir: #8be9fd;
            --prompt-sym: #ff79c6;
            --error: #ff5555;
            --success: #50fa7b;
            --border-hairline: rgba(255, 255, 255, 0.12);
            --chrome-bg: rgba(20, 22, 34, 0.72);
            --chrome-fg: #c8c8d4;
            --output-bg: rgba(20, 22, 34, 0.55);
            --output-bg-solid: #1a1c28;
            --scrollbar-thumb: rgba(189, 147, 249, 0.35);
            --scrollbar-track: transparent;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --tag-bg: rgba(189, 147, 249, 0.18);
            --tag-fg: #d4bfff;
            --matrix-green: #50fa7b;
           --bar-gradient-from: #bd93f9;
           --bar-gradient-to: #50fa7b;
           --desktop-grad-1: #1b1f3a;
           --desktop-grad-2: #3b2a6b;
           --desktop-grad-3: #0f4c5c;
           --desktop-grad-4: #08090f;
           --blob-1: rgba(189, 147, 249, 0.28);
           --blob-2: rgba(15, 76, 92, 0.35);
           --dock-bg: rgba(15, 17, 26, 0.65);
           --dock-border: rgba(255, 255, 255, 0.1);
           --tab-active: rgba(255, 255, 255, 0.12);
           --tab-inactive: rgba(255, 255, 255, 0.05);
           --shadow-deep-1: 0 25px 60px rgba(0, 0, 0, 0.55);
           --shadow-deep-2: 0 12px 30px rgba(0, 0, 0, 0.45);
           --tap-pill-bg: rgba(189, 147, 249, 0.85);
           --tap-pill-fg: #1a1c28;
           --logo-color: #bd93f9;
           --logo-glow: rgba(189, 147, 249, 0.5);
           --card-hover-lift: -4px;
           --transition-ease: cubic-bezier(0.22, 1, 0.36, 1);
           --transition-fast: 0.18s cubic-bezier(0.22, 1, 0.36, 1);
           --transition-med: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
           --transition-slow: 0.6s cubic-bezier(0.22, 1, 0.36, 1);
           --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
           --window-radius: 14px;
           --window-max-w: 980px;
           --window-max-h: 680px;
           --dock-height: 68px;
           --bar-border-radius: 6px;
           --bar-height: 20px;
           --social-grid-gap: 8px;
           --status-active: #50fa7b;
           --status-mvp: #f1fa8c;
           --status-archived: #888;
           --tier-expert: #50fa7b;
           --tier-advanced: #8be9fd;
           --tier-proficient: #f1fa8c;
        }

        html[data-theme="solarized"] {
            --accent: #b58900;
            --accent-glow: rgba(181, 137, 0, 0.3);
            --bg: #002b36;
            --fg: #839496;
            --fg-dim: #586e75;
            --user: #859900;
            --at: #586e75;
            --dir: #2aa198;
            --prompt-sym: #d33682;
            --error: #dc322f;
            --success: #859900;
            --border-hairline: rgba(255, 255, 255, 0.08);
            --chrome-bg: rgba(0, 20, 25, 0.72);
            --chrome-fg: #93a1a1;
            --output-bg: rgba(0, 28, 33, 0.6);
            --output-bg-solid: #002b36;
            --scrollbar-thumb: rgba(181, 137, 0, 0.35);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --tag-bg: rgba(181, 137, 0, 0.2);
            --tag-fg: #d4a800;
            --matrix-green: #859900;
            --bar-gradient-from: #b58900;
            --bar-gradient-to: #2aa198;
            --desktop-grad-1: #00141a;
            --desktop-grad-2: #002b36;
            --desktop-grad-3: #1a3d3a;
            --desktop-grad-4: #000a0d;
            --blob-1: rgba(181, 137, 0, 0.2);
            --blob-2: rgba(42, 161, 152, 0.25);
            --dock-bg: rgba(0, 15, 18, 0.7);
            --dock-border: rgba(255, 255, 255, 0.08);
            --tab-active: rgba(255, 255, 255, 0.09);
            --tab-inactive: rgba(255, 255, 255, 0.04);
            --tap-pill-bg: rgba(181, 137, 0, 0.85);
            --tap-pill-fg: #002b36;
            --logo-color: #b58900;
            --logo-glow: rgba(181, 137, 0, 0.45);
        }

        html[data-theme="nord"] {
            --accent: #88c0d0;
            --accent-glow: rgba(136, 192, 208, 0.3);
            --bg: #2e3440;
            --fg: #d8dee9;
            --fg-dim: #7b88a1;
            --user: #a3be8c;
            --at: #7b88a1;
            --dir: #88c0d0;
            --prompt-sym: #b48ead;
            --error: #bf616a;
            --success: #a3be8c;
            --border-hairline: rgba(255, 255, 255, 0.1);
            --chrome-bg: rgba(30, 34, 43, 0.72);
            --chrome-fg: #d8dee9;
            --output-bg: rgba(25, 28, 36, 0.55);
            --output-bg-solid: #242833;
            --scrollbar-thumb: rgba(136, 192, 208, 0.35);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --tag-bg: rgba(136, 192, 208, 0.18);
            --tag-fg: #b0d8e4;
            --matrix-green: #a3be8c;
            --bar-gradient-from: #88c0d0;
            --bar-gradient-to: #a3be8c;
            --desktop-grad-1: #1b1f2e;
            --desktop-grad-2: #2e3440;
            --desktop-grad-3: #3b4252;
            --desktop-grad-4: #0d0e13;
            --blob-1: rgba(136, 192, 208, 0.2);
            --blob-2: rgba(163, 190, 140, 0.22);
            --dock-bg: rgba(18, 20, 26, 0.7);
            --dock-border: rgba(255, 255, 255, 0.08);
            --tab-active: rgba(255, 255, 255, 0.09);
            --tab-inactive: rgba(255, 255, 255, 0.04);
            --tap-pill-bg: rgba(136, 192, 208, 0.85);
            --tap-pill-fg: #2e3440;
            --logo-color: #88c0d0;
            --logo-glow: rgba(136, 192, 208, 0.45);
        }

        html[data-theme="paper"] {
            --accent: #b3541e;
            --accent-glow: rgba(179, 84, 30, 0.22);
            --bg: #fbf8f1;
            --fg: #4a3f35;
            --fg-dim: #8a7d6f;
            --user: #2e7d32;
            --at: #8a7d6f;
            --dir: #00695c;
            --prompt-sym: #c2185b;
            --error: #c62828;
            --success: #2e7d32;
            --border-hairline: rgba(0, 0, 0, 0.12);
            --chrome-bg: rgba(245, 240, 230, 0.8);
            --chrome-fg: #4a3f35;
            --output-bg: rgba(250, 247, 240, 0.72);
            --output-bg-solid: #f5f0e6;
            --scrollbar-thumb: rgba(179, 84, 30, 0.3);
            --card-bg: rgba(0, 0, 0, 0.04);
            --card-border: rgba(0, 0, 0, 0.08);
            --tag-bg: rgba(179, 84, 30, 0.15);
            --tag-fg: #8a4a1e;
            --matrix-green: #2e7d32;
            --bar-gradient-from: #b3541e;
            --bar-gradient-to: #2e7d32;
            --desktop-grad-1: #e8e0d0;
            --desktop-grad-2: #d4c4b0;
            --desktop-grad-3: #b0a090;
            --desktop-grad-4: #8a7d6f;
            --blob-1: rgba(179, 84, 30, 0.15);
            --blob-2: rgba(46, 125, 50, 0.12);
            --dock-bg: rgba(240, 235, 225, 0.75);
            --dock-border: rgba(0, 0, 0, 0.1);
            --tab-active: rgba(0, 0, 0, 0.08);
            --tab-inactive: rgba(0, 0, 0, 0.03);
            --tap-pill-bg: rgba(179, 84, 30, 0.85);
            --tap-pill-fg: #fbf8f1;
            --logo-color: #b3541e;
            --logo-glow: rgba(179, 84, 30, 0.35);
            --shadow-deep-1: 0 25px 60px rgba(0, 0, 0, 0.25);
            --shadow-deep-2: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-mono);
            background: var(--desktop-grad-4);
            color: var(--fg);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.5s ease;
        }

        .desktop-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 20% 20%, var(--desktop-grad-1) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 15%, var(--desktop-grad-2) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 75%, var(--desktop-grad-3) 0%, transparent 55%),
                radial-gradient(ellipse at 10% 85%, var(--desktop-grad-4) 0%, transparent 60%),
                var(--desktop-grad-4);
            transition: background 0.6s ease;
            pointer-events: none;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: blobDrift 22s infinite alternate ease-in-out;
            transition: background 0.6s ease;
        }
        .blob-1 {
            width: 420px;
            height: 420px;
            background: var(--blob-1);
            top: -5%;
            left: -8%;
            animation-duration: 26s;
        }
        .blob-2 {
            width: 380px;
            height: 380px;
            background: var(--blob-2);
            bottom: -8%;
            right: -5%;
            animation-duration: 30s;
            animation-delay: -8s;
        }

        @keyframes blobDrift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(45px, -35px) scale(1.08);
            }
            66% {
                transform: translate(-30px, 30px) scale(0.95);
            }
            100% {
                transform: translate(20px, -15px) scale(1.05);
            }
        }

        .terminal-window {
            position: relative;
            z-index: 10;
            width: min(var(--window-max-w), calc(100vw - 32px));
            height: min(var(--window-max-h), calc(100vh - var(--dock-height) - 48px));
            min-height: 320px;
            border-radius: var(--window-radius);
            background: var(--output-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-hairline);
            box-shadow: var(--shadow-deep-1), var(--shadow-deep-2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.5s ease, border-color 0.5s ease;
        }

        .window-chrome {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: var(--chrome-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-hairline);
            gap: 12px;
            flex-shrink: 0;
            min-height: 48px;
            transition: background 0.5s ease, border-color 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .traffic-lights {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
        }
        .traffic-lights span {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .traffic-lights span:hover {
            transform: scale(1.2);
            opacity: 0.85;
        }
        .tl-red {
            background: #ff5f57;
        }
        .tl-yellow {
            background: #febc2e;
        }
       .tl-green {
           background: #28c840;
       }

        .terminal-window.minimized {
            transform: translateY(calc(100vh - 120px)) scale(0.6);
            opacity: 0.5;
            pointer-events: none;
        }
        .terminal-window.minimized .terminal-body,
        .terminal-window.minimized .window-chrome { pointer-events: none; }
        .terminal-window.closed {
            display: none;
        }
        .reopen-btn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg);
            font-size: 20px;
            border: none;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .reopen-btn.visible {
            display: flex;
           align-items: center;
           justify-content: center;
       }

        .cta-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            color: var(--bg);
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            z-index: 1000;
            box-shadow: 0 4px 16px var(--accent-glow);
            font-family: var(--font-mono);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .cta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

       .window-tabs {
            display: flex;
            gap: 4px;
            flex: 1;
            align-items: center;
            min-width: 0;
            overflow: hidden;
        }
        .tab {
            padding: 5px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 500;
            color: var(--chrome-fg);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
            letter-spacing: -0.01em;
            background: var(--tab-inactive);
            border: none;
            font-family: var(--font-mono);
        }
        .tab.active {
            background: var(--tab-active);
            color: var(--fg);
        }
        .tab:hover:not(.active) {
            background: var(--tab-active);
        }

        .lang-toggle-container {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            background: var(--tab-inactive);
            border-radius: 999px;
            padding: 3px;
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border-hairline);
            transition: border-color 0.3s ease;
        }
        .lang-toggle-container:hover {
            border-color: var(--accent);
        }
        .lang-option {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.3s var(--transition-ease), color 0.3s var(--transition-ease);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: var(--font-mono);
            color: var(--fg-dim);
            border: none;
            background: transparent;
        }
        .lang-option.active {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        .lang-option .flag {
            font-size: 14px;
            line-height: 1;
        }

        .terminal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
            transition: background 0.5s ease;
        }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 10px;
            font-size: 13.5px;
            line-height: 1.65;
            letter-spacing: 0.01em;
            color: var(--fg);
            transition: color 0.4s ease;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
            min-height: 0;
            word-break: break-word;
            overscroll-behavior: contain;
        }
        .terminal-output::-webkit-scrollbar {
            width: 5px;
        }
        .terminal-output::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        .terminal-output::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        .terminal-input-line {
            display: flex;
            align-items: center;
            padding: 8px 18px 14px;
            gap: 0;
            flex-shrink: 0;
            font-size: 13.5px;
            line-height: 1.65;
            position: relative;
            transition: opacity 0.3s ease;
        }
        .prompt-text {
            white-space: nowrap;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .prompt-user {
            color: var(--user);
            font-weight: 600;
        }
        .prompt-at {
            color: var(--at);
        }
        .prompt-dir {
            color: var(--dir);
        }
        .prompt-sym {
            color: var(--prompt-sym);
            margin-left: 4px;
            margin-right: 6px;
        }

        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 13.5px;
            letter-spacing: 0.01em;
            caret-color: var(--accent);
            min-width: 0;
            padding: 0;
            transition: color 0.4s ease;
        }
        .terminal-input::placeholder {
            color: var(--fg-dim);
            opacity: 0.5;
        }

        .cursor-block {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--accent);
            vertical-align: text-bottom;
            margin-left: 2px;
            animation: blinkCursor 1.1s step-end infinite;
            flex-shrink: 0;
            border-radius: 2px;
            transition: opacity 0.25s ease;
        }
        .terminal-window.input-unfocused .cursor-block {
            opacity: 0.25;
        }
        @keyframes blinkCursor {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .tap-to-type {
            position: absolute;
            right: 18px;
            bottom: 52px;
            background: var(--tap-pill-bg);
            color: var(--tap-pill-fg);
            font-size: 11px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            letter-spacing: 0.05em;
            pointer-events: none;
            animation: pulsePill 2.2s ease-in-out infinite;
            z-index: 5;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .tap-to-type.visible {
            opacity: 1;
        }
        @keyframes pulsePill {
            0%,
            100% {
                transform: translateY(0);
                box-shadow: 0 2px 10px var(--accent-glow);
            }
            50% {
                transform: translateY(-3px);
                box-shadow: 0 6px 20px var(--accent-glow);
            }
        }

        .ascii-logo {
            font-size: 8px;
            line-height: 1.15;
            color: var(--logo-color);
            text-shadow: 0 0 12px var(--logo-glow), 0 0 30px var(--logo-glow);
            white-space: pre;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin: 4px 0 6px;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.5s ease, text-shadow 0.5s ease;
            overflow-x: auto;
            max-width: 100%;
        }
        @media (max-width: 480px) {
            .ascii-logo {
                font-size: 5.5px;
                letter-spacing: -0.04em;
            }
        }
        @media (max-width: 360px) {
            .ascii-logo {
                font-size: 4.5px;
            }
        }

        .output-line {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 2px;
            transition: color 0.3s ease;
        }
        .output-line.dim {
            color: var(--fg-dim);
        }
        .output-line.error {
            color: var(--error);
        }
        .output-line.success {
            color: var(--success);
        }
        .output-line.accent {
            color: var(--accent);
        }

        .cmd-history-line {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            margin-bottom: 2px;
        }
        .cmd-history-line .prompt-part {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .help-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 24px;
            margin: 6px 0;
        }
        .help-item {
            display: flex;
            gap: 8px;
            align-items: baseline;
            font-size: 12.5px;
            line-height: 1.5;
        }
        .help-cmd {
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
            min-width: 72px;
            flex-shrink: 0;
        }
        .help-desc {
            color: var(--fg-dim);
        }

        .about-table {
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.7;
        }
        .about-row {
            display: flex;
            gap: 12px;
            align-items: baseline;
        }
        .about-key {
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
            min-width: 130px;
            flex-shrink: 0;
        }
        .about-val {
            color: var(--fg);
        }

        .skills-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin: 8px 0;
        }
        .skill-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }
        .skill-label {
            min-width: 120px;
            color: var(--fg);
            font-weight: 500;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
       .skill-bar-track {
           flex: 1;
            height: var(--bar-height);
           background: var(--card-bg);
           border-radius: var(--bar-border-radius);
           overflow: hidden;

           const t = () => T[lang];

            function toJalali(date) {
                const gy = date.getFullYear(), gm = date.getMonth() + 1, gd = date.getDate();
                const gdm = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
                const gy2 = (gm > 2) ? (gy + 1) : gy;
                let days = 355666 + (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + gdm[gm - 1];
                let jy = -1595 + (33 * Math.floor(days / 12053));
                days %= 12053;
                jy += 4 * Math.floor(days / 1461);
                days %= 1461;
                if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
                let jm, jd;
                if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
                else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
                const mn = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
                return jd + ' ' + mn[jm - 1] + ' ' + jy;
            }

            function typeASCII() {
                const lines = getASCIILogo();
                const container = document.createElement('div');
                container.className = 'ascii-logo';
                container.style.direction = 'ltr';
                container.style.textAlign = 'left';
                output.appendChild(container);

                if (prefersReducedMotion) {
                    container.textContent = lines.join('\n');
                    scrollToBottom();
                    afterBoot();
                    return;
                }

                let lineIdx = 0;
                let charIdx = 0;
                const charPerTick = 4;
                const tickMs = 12;

                function typeNext() {
                    if (lineIdx >= lines.length) {
                        afterBoot();
                        return;
                    }
                    const currentLine = lines[lineIdx];
                    const partial = currentLine.substring(0, charIdx);
                    const remaining = lines.slice(0, lineIdx).join('\n');
                    container.textContent = remaining + (remaining ? '\n' : '') + partial;
                    scrollToBottom();
                    charIdx += charPerTick;
                    if (charIdx > currentLine.length) {
                        charIdx = 0;
                        lineIdx++;
                        if (lineIdx < lines.length) {
                            container.textContent = lines.slice(0, lineIdx).join('\n');
                            scrollToBottom();
                        }
                    }
                    typingTimers.push(setTimeout(typeNext, tickMs));
                }
                typeNext();
            }

            function runCommand(cmdText) {
                const trimmed = cmdText.trim();
                if (!trimmed) return;
                addCommandLine(trimmed);
                history.push(trimmed);
                historyIndex = history.length;
                const parts = trimmed.split(/\s+/);
                const cmd = parts[0].toLowerCase();
                const args = parts.slice(1);

                switch (cmd) {
                    case 'help':
                        cmdHelp();
                        break;
                    case 'about':
                        cmdAbout();
                        break;
                    case 'skills':
                        cmdSkills();
                        break;
                    case 'projects':
                        cmdProjects();
                        break;
                    case 'contact':
                        cmdContact();
                        break;
                    case 'theme':
                        cmdTheme(args);
                        break;
                    case 'matrix':
                        cmdMatrix();
                        break;
                    case 'clear':
                        clearOutput();
                        break;
                    case 'history':
                        cmdHistory();
                        break;
                    case 'whoami':
                        cmdWhoami();
                        break;
                    case 'date':
                        cmdDate();
                        break;
                    case 'echo':
                        cmdEcho(parts.slice(1).join(' '));
                        break;
                    case 'ls':
                        cmdLs();
                        break;
                   case 'sudo':
                       cmdSudo();
                       break;
                    case 'neofetch':
                        cmdNeofetch();
                        break;
                    case 'quote':
                        cmdQuote();
                        break;
                    case 'cls':
                        clearOutput();
                        break;
                    case 'exit':
                        cmdExit();
                        break;
                    case 'banner':
                        cmdBanner();
                        break;
                    case 'social':
                        cmdSocial();
                        break;
                   default:
                       cmdUnknown(trimmed);
                       break;
                }
                scrollToBottom();
            }

                       const tierLabel = skill.pct >= 90 ? 'Expert' : skill.pct >= 80 ? 'Advanced' : 'Proficient';
                      row.innerHTML = '<span class="skill-label">' + skill.label + '</span>' +
                          '<span class="skill-bar-track" data-tooltip="' + skill.label + ' — ' + skill.pct + '% ' + tierLabel + '"><span class="skill-bar-fill ' + tierClass + '" style="--target-width:' +
                           skill.pct + '%;"></span><span class="skill-pct">0%</span></span>';
                      container.appendChild(row);
                       const fillEl = row.querySelector('.skill-bar-fill');
                       const pctEl = row.querySelector('.skill-pct');
                       const animateCounter = (start, end, el) => {
                           const duration = 600;
                           const startTime = performance.now();
                           const step = (now) => {
                               const elapsed = now - startTime;
                               const progress = Math.min(elapsed / duration, 1);
                               const eased = 1 - Math.pow(1 - progress, 3);
                               el.textContent = Math.round(start + (end - start) * eased) + '%';
                               if (progress < 1) requestAnimationFrame(step);
                           };
                           requestAnimationFrame(step);
                       };
                       if (prefersReducedMotion) {
                           fillEl.style.width = skill.pct + '%';
                           pctEl.textContent = skill.pct + '%';
                       } else {
                           setTimeout(() => {
                               fillEl.classList.add('animated');
                               animateCounter(0, skill.pct, pctEl);
                           }, 40 + i * 50);
                       }
                   });
               });
               output.appendChild(container);
               scrollToBottom();
           }

            function cmdMatrix() {
                if (matrixActive) return;
                matrixActive = true;
                const canvas = document.createElement('canvas');
                canvas.className = 'matrix-canvas active';
                canvas.id = 'matrixCanvas';
                terminalBody.appendChild(canvas);
                canvas.width = terminalBody.clientWidth;
                canvas.height = terminalBody.clientHeight;
                matrixCanvas = canvas;
                matrixCtx = canvas.getContext('2d');
                matrixStartTime = Date.now();

                const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789{}[]<>/\\|=+-*&^%$#@!';
                const fontSize = 13;
                const columns = Math.ceil(canvas.width / fontSize);
                const drops = new Array(columns).fill(0);

                function getMatrixColor() {
                    const green = getComputedStyle(document.documentElement).getPropertyValue('--matrix-green').trim() ||
                        '#50fa7b';
                    return green;
                }

                function drawMatrix() {
                    const green = getMatrixColor();
                    matrixCtx.fillStyle = 'rgba(0,0,0,0.08)';
                    matrixCtx.fillRect(0, 0, canvas.width, canvas.height);
                    matrixCtx.font = fontSize + 'px ' + getComputedStyle(document.documentElement).getPropertyValue(
                        '--font-mono');
                    for (let i = 0; i < columns; i++) {
                        const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
                        const x = i * fontSize;
                        const y = drops[i] * fontSize;
                        matrixCtx.fillStyle = green;
                        matrixCtx.fillText(glyph, x, y);
                        if (y > canvas.height && Math.random() > 0.975) {
                            drops[i] = 0;
                        }
                        drops[i]++;
                    }
                    const elapsed = Date.now() - matrixStartTime;
                    if (elapsed > 7000) {
                        stopMatrix(true);
                        return;
                    }
                    matrixRAF = requestAnimationFrame(drawMatrix);
                }
                drawMatrix();
            }

            function stopMatrix(showJoke) {
                if (!matrixActive) return;
                matrixActive = false;
                if (matrixRAF) cancelAnimationFrame(matrixRAF);
                if (matrixCanvas) {
                    matrixCanvas.classList.remove('active');
                    setTimeout(() => {
                        if (matrixCanvas && matrixCanvas.parentNode) {
                            matrixCanvas.parentNode.removeChild(matrixCanvas);
                        }
                    }, 280);
                    matrixCanvas = null;
                    matrixCtx = null;
                }
                if (showJoke) {
                    addLine(t().matrixJoke, 'accent');
                }
                scrollToBottom();
                input.focus();

            function refreshLastOutput() {
                if (output.children.length > 0) {
                    const lastChild = output.lastElementChild;

                        // Just re-render relevant text direction
                        if (lang === 'fa') {

           function handleTabCompletion() {
               const val = input.value;
               const parts = val.split(/\s+/);
               const first = parts[0].toLowerCase();
               if (!val.includes(' ')) {
                   const matches = commands.filter(c => c.startsWith(first));
                   if (matches.length === 1) {
                       input.value = matches[0] + ' ';
                   } else if (matches.length > 1) {
                        const dropdown = document.createElement('div');
                        dropdown.className = 'completion-dropdown';
                        matches.forEach(m => {
                            const chip = document.createElement('span');
                            chip.className = 'completion-item';
                            chip.textContent = m;
                            dropdown.appendChild(chip);
                        });
                        output.appendChild(dropdown);
                        scrollToBottom();
                   }
                   return;
               }
               if (first === 'theme' && parts.length === 2) {
                   const partial = parts[1].toLowerCase();
                   const matches = themes.filter(th => th.startsWith(partial));
                   if (matches.length === 1) {
                       input.value = 'theme ' + matches[0] + ' ';
                   } else if (matches.length > 1) {
                        const dropdown = document.createElement('div');
                        dropdown.className = 'completion-dropdown';
                        matches.forEach(m => {
                            const chip = document.createElement('span');
                            chip.className = 'completion-item';
                            chip.textContent = m;
                            dropdown.appendChild(chip);
                        });
                        output.appendChild(dropdown);
                        scrollToBottom();
                   }
               }
           }

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = input.value;
                    if (matrixActive) {
                        stopMatrix(true);
                        input.value = '';
                        return;
                    }
                    if (val.trim()) {
                        runCommand(val);
                    }
                    input.value = '';
                    historyIndex = history.length;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (history.length === 0) return;
                    if (historyIndex > 0) {
                        historyIndex--;
                        input.value = history[historyIndex];
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (historyIndex < history.length) {
                        historyIndex++;
                        input.value = historyIndex < history.length ? history[historyIndex] : '';
                    }
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    if (matrixActive) {
                        stopMatrix(true);
                        return;
                    }
                    handleTabCompletion();
               } else if (e.key === 'l' && e.ctrlKey) {
                   e.preventDefault();
                   clearOutput();
                   input.value = '';
                } else if (e.key === 'u' && e.ctrlKey) {
                    e.preventDefault();
                    input.value = '';
                } else if (e.key === 'w' && e.ctrlKey) {
                    e.preventDefault();
                    const val = input.value;
                    const cursorPos = input.selectionStart;
                    const before = val.substring(0, cursorPos);
                    const after = val.substring(cursorPos);
                    const lastWord = before.replace(/\S+\s*$/, '');
                    input.value = lastWord + after;
                    const newPos = lastWord.length;
                    input.setSelectionRange(newPos, newPos);
               } else if (e.key === 'c' && e.ctrlKey) {
                   e.preventDefault();
                   addCommandLine('^C');
                    input.value = '';
                    if (matrixActive) stopMatrix(true);
                } else if (matrixActive) {
                    stopMatrix(true);
                }
            });

            input.addEventListener('focus', () => {
                terminalWindow.classList.remove('input-unfocused');
                tapPill.classList.remove('visible');
            });

            input.addEventListener('blur', () => {
                terminalWindow.classList.add('input-unfocused');
                if (isMobile && !input.value) {
                    setTimeout(() => {
                        if (document.activeElement !== input) {
                            tapPill.classList.add('visible');
                        }
                    }, 400);
                }
            });

            document.addEventListener('click', (e) => {
                if (matrixActive) {
                    const canvas = $('#matrixCanvas');
                    if (canvas && canvas.contains(e.target)) {
                        stopMatrix(true);
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if (matrixActive && e.key && e.key !== 'Enter' && e.key !== 'Tab') {
                    stopMatrix(true);
                }
            });

            langEn.addEventListener('click', () => setLanguage('en'));
           langFa.addEventListener('click', () => setLanguage('fa'));

            $('#tlRed').addEventListener('click', () => {
                terminalWindow.classList.add('closed');
                $('#reopenBtn').classList.add('visible');
            });
            $('#tlYellow').addEventListener('click', () => {
                terminalWindow.classList.toggle('minimized');

                terminalWindow.classList.remove('closed', 'minimized');
                $('#reopenBtn').classList.remove('visible');

           $$('.dock-icon').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cmd = btn.getAttribute('data-command');
                    if (matrixActive) {
                        stopMatrix(false);
                    }
                   if (cmd === 'themes') {
                        const currentIdx = themes.indexOf(currentTheme);
                        const nextIdx = (currentIdx + 1) % themes.length;
                        const nextTheme = themes[nextIdx];
                        currentTheme = nextTheme;
                        document.documentElement.setAttribute('data-theme', nextTheme);
                        addLine(t().themeSwitched + ' → ' + nextTheme, 'success');
                   } else {
                       runCommand(cmd);
                   }
                    input.focus();
                });
            });

            $$('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    $$('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const tabId = tab.getAttribute('data-tab');
                    if (tabId === 'notes') {
                        addLine('--- notes.md ---', 'accent');
                        addLine(lang === 'en' ? '# Notes: Focus on shipping MVP first.' :
                            '# یادداشت‌ها: اول روی MVP تمرکز کنید.', 'dim');
                    } else if (tabId === 'log') {
                        addLine('--- server.log ---', 'accent');
                        addLine(lang === 'en' ? '[INFO] Server running on port 3000' :
                            '[INFO] سرور روی پورت 3000 اجرا شد', 'dim');
                    }
                });
            });

            window.addEventListener('resize', () => {
                if (matrixCanvas) {
                    matrixCanvas.width = terminalBody.clientWidth;
                    matrixCanvas.height = terminalBody.clientHeight;
                }
            });

            function init() {
                updatePrompt();
                updateDockTooltips();
                terminalWindow.classList.add('input-unfocused');
                if (isMobile && !input.value) {
                    setTimeout(() => tapPill.classList.add('visible'), 1500);
                }
                typeASCII();
                if (!prefersReducedMotion) {
                    // Ensure blob animation runs
                }
            }

            init();
        })();
    </script>
